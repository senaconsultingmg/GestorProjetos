<style>

.gx .nt{color:var(--accent);font-size:11px;cursor:help}.gx td.neg,.gx td.r.neg{color:#b3261e}

.gx small.sa{display:block;font-size:10px;color:var(--muted,#6b7a78);font-weight:400}.gx small.sa.neg{color:#b3261e}
.ce{border:1px solid var(--line);border-radius:10px;min-height:120px;padding:10px;background:#fff;line-height:1.5}.ce:empty:before{content:attr(data-ph);color:#8a9694}.ce img{max-width:100%;height:auto;border-radius:6px;margin:6px 0;display:block}.ce.ro{background:var(--surface2,#f5f8fc);min-height:0}

/* ===== layout com barra lateral ===== */
:root{--side:#0c2340;--side2:#13335a;--sidetx:#c9d6e6;--sidemut:#7f95b2}
body{background:#f3f6f9}
.shell{display:flex;min-height:100vh}
aside.side{width:252px;flex:none;background:var(--side);color:var(--sidetx);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;z-index:12}
.brand{display:flex;gap:10px;align-items:center;padding:16px 16px 14px;border-bottom:1px solid #ffffff14;color:#fff}

.sn{padding:6px 10px 18px;display:flex;flex-direction:column;gap:2px}

.sn svg{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.col{flex:1;min-width:0;display:flex;flex-direction:column}
header.top{background:#fff;color:var(--ink);border-bottom:1px solid var(--line);padding:10px 22px;flex-wrap:nowrap}
.hb{display:none;border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 10px;font-size:18px;cursor:pointer}

.usr{display:flex;gap:10px;align-items:center}

.usr select{border:1px solid var(--line);background:#fff;color:var(--ink);padding:5px 8px;max-width:270px;font-size:13px}

.card{border-radius:14px;box-shadow:0 1px 3px #10223a12;padding:18px 20px}
.rp h3{font-size:16px;margin:0 0 10px}
.rp dl{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;margin:0;font-size:14px}.rp dt{color:var(--muted)}.rp dd{margin:0;font-weight:600}
.steps{display:flex;gap:0;margin:8px 0 16px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 10px;box-shadow:0 1px 3px #10223a12}
.step{flex:1;min-width:0;border:0;background:none;padding:0 6px;text-align:center;position:relative;color:var(--muted);font-size:13px}

function exifSeg(buf){const v=new DataView(buf);if(v.getUint16(0)!==0xFFD8)return null;let o=2;while(o+4<v.byteLength){const m=v.getUint16(o);if(m===0xFFDA||(m&0xFF00)!==0xFF00)return null;const len=v.getUint16(o+2);if(m===0xFFE1&&v.getUint32(o+4)===0x45786966)return new Uint8Array(buf.slice(o,o+2+len));o+=2+len}return null}
function exifOrient1(seg){try{const v=new DataView(seg.buffer,seg.byteOffset,seg.byteLength),t=10,le=v.getUint16(t)===0x4949,i0=v.getUint32(t+4,le),n=v.getUint16(t+i0,le);for(let k=0;k<n;k++){const e=t+i0+2+k*12;if(v.getUint16(e,le)===0x0112){v.setUint16(e+8,1,le);break}}}catch(x){}return seg}
async function reduzirImg(f,max=1600,q=.75){
 if(!/^image\/(jpeg|png|webp)$/.test(f.type))return null;
 const buf=await f.arrayBuffer(),exif=f.type==='image/jpeg'?exifSeg(buf):null;
 let bmp;try{bmp=await createImageBitmap(f)}catch(x){return null}
 const k=Math.min(1,max/Math.max(bmp.width,bmp.height)),w=Math.round(bmp.width*k),h=Math.round(bmp.height*k),cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(bmp,0,0,w,h);
 const bl=await new Promise(r=>cv.toBlob(r,'image/jpeg',q));let out=new Uint8Array(await bl.arrayBuffer());
 if(exif&&exif.length<65000){const seg=exifOrient1(new Uint8Array(exif)),r=new Uint8Array(out.length+seg.length);r.set(out.subarray(0,2),0);r.set(seg,2);r.set(out.subarray(2),2+seg.length);out=r}
 return{blob:new Blob([out],{type:'image/jpeg'}),orig:f.size,novo:out.length,w,h,exif:!!exif};
}

function vRel(){

  return'<section class="relb"><h2>'+esc(ac.id+' · '+ac.nome)+'</h2><div class="small muted">'+({aulas:'Aulas',evento:'Evento',cadastro:'Cadastro',generico:'Genérica'}[ac.tipo]||ac.tipo)+' · '+alunosAcao(ac.id,r.ate).length+' aluno(s) na ação ao fim do período</div>'+
   '<h3>Metas</h3><div class="tw"><table><thead><tr><th>Meta</th><th class="n">Alvo</th><th class="n">No período</th><th class="n">Acumulado até '+fd(r.ate)+'</th></tr></thead><tbody>'+mt+'</tbody></table></div>'+
   '<h3>Atividades do período</h3><div class="small">'+re.length+' realizada(s)'+(nr?' · '+nr+' sem registro':'')+(cn?' · '+cn+' cancelada(s)':'')+' · '+sum(re.map(e=>e.fotos||0))+' foto(s) · '+sum(re.map(e=>(e.docs||[]).length))+' documento(s)</div>'+(evs.length?'<div class="tw"><table><thead><tr><th>Data</th><th>Horário</th><th>Tipo</th><th>Instrutor</th><th>Local</th><th class="n">Presentes</th><th class="n">Fotos</th><th class="n">Docs</th><th>Situação</th></tr></thead><tbody>'+tl+'</tbody></table></div>':'<p class="muted small">Nenhuma atividade no período.</p>')+

/* ===== Equipe (staff): vagas, pessoas e prestação mensal por pessoa ===== */
const STM={aberta:['Em preparação',''],em_analise:['Em análise','warn'],aprovada:['Aprovada','ok'],devolvida:['Devolvida','bad']};
const VINC=['CLT','PJ','Bolsista','Estagiário','Outro'];
const stMesSt=m=>(D.staffMes&&D.staffMes[m]||{st:'aberta'}).st;
const stOcup=()=>D.equipe.filter(p=>!p.deslig||p.deslig>HOJE).length;
const stAtiva=(p,m)=>p.adm.slice(0,7)<=m&&(!p.deslig||p.deslig.slice(0,7)>=m);
const stItens=p=>[{k:'sal',nome:'Salário',prev:p.sal}].concat((p.ben||[]).map(b=>({k:b.id,nome:b.nome,prev:b.valor})));
const stReg=(pid,m)=>(D.staffPC&&D.staffPC[m+'|'+pid])||{pago:{},arq:[],obs:''};
const stItOk=(r,k)=>{const x=r.pago[k];return!!(x&&x.v>0&&x.d&&r.arq.some(a=>a.t===k))};
const stComp=(p,m)=>{const r=stReg(p.id,m),it=stItens(p),ok=it.filter(i=>stItOk(r,i.k)).length;return{ok,tot:it.length,full:ok===it.length}};
const stMeses=()=>{if(!D.exIni)return[];const a=D.exIni.slice(0,7),h=HOJE.slice(0,7),f=D.exFim?D.exFim.slice(0,7):h;return mesesDe(a,h<f?h:f)};

 const m=stMeses().includes(S.mes)?S.mes:(stMeses().slice(-1)[0]||S.mes),ger=has('staff_gerir')&&!trancado(),oc=stOcup(),mx=D.staffMax||0,ms=stMeses(),sm=stMesSt(m);
 const ativos=D.equipe.filter(p=>stAtiva(p,m));
 const linhas=D.equipe.map(p=>{const des=p.deslig&&p.deslig<=HOJE;return'<tr'+(des?' style="opacity:.6"':'')+'><td><b>'+esc(p.nome)+'</b><div class="small muted">'+esc(p.cargo)+' · '+esc(p.vinc)+'</div></td><td>'+fd(p.adm)+(p.deslig?'<div class="small muted">até '+fd(p.deslig)+'</div>':'')+'</td><td class="n">'+stMv(p.sal)+'</td><td class="small">'+((p.ben||[]).map(b=>esc(b.nome)+' '+(veTotal()?brl(b.valor):'•••')).join('<br>')||'<span class="muted">—</span>')+'</td><td>'+pill(des?'Desligado':'Ativo',des?'':'ok')+'</td><td>'+(ger?'<button class="btn sm" data-a="st-edit" data-id="'+p.id+'">Editar</button>':'')+'</td></tr>'}).join('');
 const pm=ativos.map(p=>{const c=stComp(p,m),r=stReg(p.id,m),sal=stItOk(r,'sal');return'<tr><td><b>'+esc(p.nome)+'</b><div class="small muted">'+esc(p.cargo)+'</div></td><td>'+(sal?'<span class="ok">✓ comprovado</span>':'<span class="bad">pendente</span>')+'</td><td>'+((p.ben||[]).length?(c.ok-(sal?1:0))+' de '+p.ben.length:'<span class="muted">—</span>')+'</td><td class="n">'+r.arq.length+'</td><td>'+(c.full?pill('Completo','ok'):pill(c.ok+' de '+c.tot+' itens','warn'))+'</td><td><button class="btn sm" data-a="stp-abrir" data-id="'+p.id+'">'+(has('staff_prest')&&['aberta','devolvida'].includes(sm)&&!travado(m)?'Comprovar':'Ver')+'</button></td></tr>'}).join('');
 const todos=ativos.length>0&&ativos.every(p=>stComp(p,m).full);
 let acao='';
